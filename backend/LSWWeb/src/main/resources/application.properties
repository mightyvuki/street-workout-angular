spring.application.name=LSWWeb
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
spring.datasource.url=jdbc:mysql://localhost:3306/dblsw
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.maximum-pool-size=2
server.servlet.context-path=/LSW
server.port=8080
spring.jpa.hibernate.naming.physicalStrategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.deserialization.READ_ENUMS_USING_TO_STRING=true