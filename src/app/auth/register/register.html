<div class="register-box">
  <h2 class="text-center mb-4">Registracija</h2>
  @if (error) {
  <div class="alert alert-danger">{{ error }}</div>
  } @if (message) {
  <div class="alert alert-success">{{ message }}</div>
  } @if (!loading) {
  <form (ngSubmit)="register()" #registerForm="ngForm">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="ime">Ime:</label>
        <input type="text" id="ime" name="ime" [(ngModel)]="korisnik.ime" class="form-control" required />
      </div>

      <div class="col-md-6 mb-3">
        <label for="prezime">Prezime:</label>
        <input type="text" id="prezime" name="prezime" [(ngModel)]="korisnik.prezime" class="form-control" required />
      </div>
    </div>

    <div class="mb-3">
      <label for="username">Korisničko ime:</label>
      <input type="text" id="username" name="username" [(ngModel)]="korisnik.username" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="korisnik.email" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="password">Lozinka:</label>
      <input type="password" id="password" name="password" [(ngModel)]="korisnik.password" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="pol">Pol:</label>
      <select id="pol" name="pol" [(ngModel)]="korisnik.pol" class="form-select" required>
        <option value="">Izaberi</option>
        <option value="muško">Muško</option>
        <option value="žensko">Žensko</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="datumRodjenja">Datum rođenja:</label>
      <input
        type="date"
        id="datumRodjenja"
        name="datumRodjenja"
        [(ngModel)]="korisnik.datumRodjenja"
        class="form-control"
        required
      />
    </div>

    <button type="submit" class="btn btn-custom w-100" [disabled]="registerForm.invalid">Registruj se</button>
  </form>
    }
  @if (loading) {
  <div class="text-center mt-3">
    <div class="spinner-border text-primary" role="status"></div>
    <p>Registracija u toku...</p>
  </div>
  }
  

  <div class="mt-3 text-center">
    Već imaš nalog? <a routerLink="/login">Prijavi se</a><br />
    <a routerLink="/">Povratak na početnu</a>
  </div>
</div>
